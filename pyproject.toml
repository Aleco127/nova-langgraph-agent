[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-agent"
version = "0.1.0"
description = "Conversational sales agent modelled as a LangGraph state machine"
requires-python = ">=3.11"
# Deliberately empty. Everything in this milestone is pure stdlib, which is what
# lets the whole suite run in the CI container with no install step beyond the
# package itself. The graph dependencies arrive with the LangGraph milestone.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.16.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# E/F are the pyflakes+pycodestyle baseline; the rest catch the things that
# actually show up in review: unsorted imports, mutable default arguments,
# dead comparisons, comprehensions built the long way.
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
