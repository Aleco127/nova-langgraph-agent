[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-agent"
version = "0.1.0"
description = "Conversational sales agent modelled as a LangGraph state machine"
requires-python = ">=3.11"
# Both pins are exact. LangGraph reached 1.x recently enough that "compatible
# release" ranges still cross API moves, and a graph that silently rewires
# itself on a transitive upgrade is the kind of failure the test suite would
# report as a logic bug. Transitive packages stay on ranges so a security
# release can land without editing this file -- which matters, because the
# vulnerability gate scans every one of them.
dependencies = [
    "langgraph==1.2.11",
    "langchain-core==1.6.0",
    # Not pinned: it is langchain-core's own dependency and this project only
    # touches it through the model base class. A range lets a security release
    # land without a lockstep bump here -- which matters, because the
    # vulnerability gate scans it either way.
    "pydantic>=2.7.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.16.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# E/F are the pyflakes+pycodestyle baseline; the rest catch the things that
# actually show up in review: unsorted imports, mutable default arguments,
# dead comparisons, comprehensions built the long way.
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
# Warnings fail the build. With no third-party dependencies there is nothing
# noisy to suppress, so anything raised here is ours -- and the first one this
# caught was a docstring whose backslash escape had stopped being valid.
filterwarnings = ["error"]
