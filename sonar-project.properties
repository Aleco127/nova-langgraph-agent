# Keys are filled in from the SonarQube Cloud project page; both are shown
# there under Information after the repository is imported.
sonar.projectKey=Aleco127_nova-langgraph-agent
sonar.organization=aleco127

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Block the workflow on the gate instead of reporting it after the fact. Without
# this the scan is fire-and-forget: the run goes green while the gate is still
# being evaluated, which is exactly the decorative badge this repository is
# meant to avoid.
sonar.qualitygate.wait=true
