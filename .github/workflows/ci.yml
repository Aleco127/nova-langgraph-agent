name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. The image job widens this for itself, and only to what
# uploading a SARIF report needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Absolute floor, enforced on the runner. It is deliberately below the 100%
  # the suite currently reports: pinning the gate to the current number turns
  # every defensive branch into a build failure, and a team that cannot add a
  # guard clause without writing a ceremonial test learns to bypass the gate.
  COVERAGE_FLOOR: "95"
  IMAGE: nova-agent

jobs:
  quality:
    name: Lint, tests, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Formatting
        run: ruff format --check .

      - name: Tests and coverage gate
        run: |
          pytest \
            --cov=nova_agent \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_FLOOR }}

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  image:
    name: Image build, vulnerability gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t "${IMAGE}:${GITHUB_SHA}" .

      - name: Smoke test the image
        # Proves the thing that was built actually runs. A build that succeeds
        # and an entry point that crashes on start look identical otherwise.
        run: |
          output=$(docker run --rm "${IMAGE}:${GITHUB_SHA}" "quiero una pagina web")
          echo "$output"
          echo "$output" | grep -q '"focus": "paginas-web"'

      # Two scans on purpose. This one always succeeds so the SARIF report is
      # produced and uploaded even when the gate below is about to fail --
      # otherwise the run that most needs a report is the one without one.
      - name: Scan for report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scan-type: image
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scan-type: image
          format: table
          # --ignore-unfixed is the difference between a gate people respect and
          # one they learn to skip: without it a CVE with no released patch
          # keeps the pipeline red indefinitely, and the team routes around it.
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
